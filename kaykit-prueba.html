<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KayKit · Prueba de animaciones JS</title><style>*{box-sizing:border-box}body{margin:0;background:#081526;color:#effffb;font:15px system-ui}main{max-width:720px;margin:auto;padding:16px}h1{font-size:24px}p{color:#accbd0}#view{height:52vh;min-height:320px;border:2px solid #35bda3;border-radius:20px;overflow:hidden;background:#17344a;touch-action:pan-y}canvas{display:block;width:100%;height:100%}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}button,select{background:#1d4559;color:white;border:1px solid #4b9d9c;border-radius:12px;padding:13px 7px;font-weight:700;font-size:14px}button:active{background:#147e73}select{width:100%;margin-bottom:10px}#state{padding:10px;color:#79f0ca}.hint{font-size:12px}a{color:#77efc8}</style></head><body><main><h1>🧍 KayKit · Laboratorio 3D</h1><p>Personajes con esqueleto real y animaciones incluidas. Prueba separada: todavía no cambia tu juego.</p><label for="model">Elegí personaje</label><select id="model"><option>Knight</option><option>Rogue</option><option>Rogue_Hooded</option><option>Mage</option><option>Barbarian</option></select><div id="view"></div><div id="state">Cargando modelo…</div><div class="controls" id="buttons"></div><p class="hint">Arrastrá el personaje para girarlo. En Android se carga un solo modelo por vez para ahorrar memoria.</p><a href="luz-roja.html">← Volver al juego actual</a></main><script type="module">
import * as THREE from './bomba3d/vendor/three.module.js';import {GLTFLoader} from './bomba3d/vendor/GLTFLoader.js';
const view=document.getElementById('view'),state=document.getElementById('state'),select=document.getElementById('model'),buttons=document.getElementById('buttons');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputColorSpace=THREE.SRGBColorSpace;view.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#18384b');scene.add(new THREE.HemisphereLight(0xffffff,0x426b79,2.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,6,5);scene.add(sun);const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,2.1,7);camera.lookAt(0,1.1,0);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:'#226b66'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;scene.add(floor);let root,mixer,active,clips={},angle=0,token=0;const loader=new GLTFLoader();const actions=[['Quieto','Idle'],['Caminar','Walking_A'],['Correr','Running_A'],['Golpear','Unarmed_Melee_Attack_Punch_A'],['Recibir golpe','Hit_A'],['Caer','Death_A'],['Celebrar','Cheer'],['Saltar','Jump_Full_Short'],['Levantarse','Jump_Start']];
function animate(name){if(!mixer||!clips[name])return;const next=mixer.clipAction(clips[name]);next.reset().setLoop(THREE.LoopRepeat,Infinity).fadeIn(.18).play();if(active&&active!==next)active.fadeOut(.18);active=next;state.textContent='▶ '+name;}
async function load(){const current=++token;state.textContent='Descargando '+select.value+'…';try{const gltf=await Promise.race([new Promise((resolve,reject)=>loader.load('./kaykit/'+select.value+'.glb',resolve,e=>{if(e.total)state.textContent='Descargando '+select.value+'… '+Math.round(100*e.loaded/e.total)+'%';else state.textContent='Descargando '+select.value+'… '+Math.round(e.loaded/1024)+' KB'},reject)),new Promise((_,reject)=>setTimeout(()=>reject(new Error('La carga superó 25 segundos. Probá con WiFi o recargá la página.')),25000))]);state.textContent='Preparando esqueleto y animaciones…';if(current!==token)return;if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}root=gltf.scene;root.rotation.y=angle;scene.add(root);const bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3());const scale=2.65/Math.max(size.y,.1);root.scale.setScalar(scale);const box=new THREE.Box3().setFromObject(root);root.position.y=-box.min.y;mixer=new THREE.AnimationMixer(root);clips=Object.fromEntries(gltf.animations.map(a=>[a.name,a]));active=null;buttons.replaceChildren();for(const [label,name] of actions){if(!clips[name])continue;const b=document.createElement('button');b.textContent=label;b.onclick=()=>animate(name);buttons.append(b)}animate('Idle');state.textContent='✅ '+select.value+' · '+gltf.animations.length+' animaciones · esqueleto '+(gltf.parser.json.skins?.length?'sí':'no');}catch(e){console.error(e);state.textContent='❌ Error cargando '+select.value+': '+e.message}}
select.addEventListener('change',load);let x=null;view.addEventListener('pointerdown',e=>{x=e.clientX});view.addEventListener('pointermove',e=>{if(x===null||!root)return;angle+=(e.clientX-x)*.01;root.rotation.y=angle;x=e.clientX});for(const ev of ['pointerup','pointercancel','pointerleave'])view.addEventListener(ev,()=>x=null);const resize=()=>{const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(view);window.addEventListener('error',e=>{state.textContent='❌ Error: '+e.message});window.addEventListener('unhandledrejection',e=>{state.textContent='❌ Error: '+String(e.reason)});const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);mixer?.update(dt);renderer.render(scene,camera)}frame();load();
</script></body></html>
