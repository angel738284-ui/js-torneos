<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🚦 Luz Roja Luz Verde · JS Family</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1224;color:#f4fbff;font:15px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:12px 12px 32px}h1{font-size:24px;margin:8px 0}p{color:#b4d1db}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#20384a;border:1px solid #45657a;border-radius:15px;padding:9px 12px;font-weight:800}.arena{height:min(67vh,650px);min-height:430px;position:relative;overflow:hidden;border:3px solid #377c7c;border-radius:25px;background:repeating-linear-gradient(0deg,transparent 0 77px,#ffffff10 78px 80px),linear-gradient(90deg,#266d64,#398e79 50%,#266d64);box-shadow:0 12px 40px #0007}.finish{position:absolute;top:15%;width:100%;height:10px;background:repeating-linear-gradient(90deg,#fff 0 18px,#182a33 18px 36px);box-shadow:0 0 15px #fff9}.doll{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:65px;transition:transform .4s;filter:drop-shadow(0 8px 5px #0007);z-index:3}.doll.red{transform:translateX(-50%) rotateY(180deg)}.light{position:absolute;top:16px;right:13px;border-radius:50%;width:48px;height:48px;background:#1fea84;box-shadow:0 0 24px #1fea84;z-index:4}.light.red{background:#ff334f;box-shadow:0 0 24px #ff334f}.runner{position:absolute;bottom:5%;width:48px;height:77px;transition:bottom .12s linear;display:flex;flex-direction:column;align-items:center;z-index:2;filter:drop-shadow(0 3px 3px #0008)}.runner .head{height:35px;width:35px;border-radius:50%;background:var(--skin);border:2px solid #ffffff44;display:flex;justify-content:space-evenly;align-items:center}.eye{width:8px;height:12px;border-radius:50%;background:#fff}.torso{height:27px;width:38px;background:var(--shirt);border-radius:12px 12px 8px 8px;position:relative}.torso:before,.torso:after{content:'';position:absolute;top:3px;width:9px;height:21px;background:var(--skin);border-radius:8px}.torso:before{left:-7px}.torso:after{right:-7px}.legs{display:flex;gap:8px}.legs i{width:11px;height:16px;background:#1c2944;border-radius:3px 3px 6px 6px}.runner.walk .legs i:first-child{animation:step .24s infinite alternate}.runner.walk .legs i:last-child{animation:step .24s infinite alternate-reverse}@keyframes step{to{transform:translateY(-5px)}}.runner b{position:absolute;top:-22px;background:#10283f;padding:3px 6px;border-radius:9px;font-size:10px;white-space:nowrap}.runner.dead{opacity:0;transform:scale(.3);transition:opacity .45s,transform .45s}.runner.won{filter:drop-shadow(0 0 12px gold)}.controls{position:sticky;bottom:8px;display:grid;gap:10px;margin-top:12px}.btn{border:1px solid #71c8bd;background:#1d7775;color:white;border-radius:16px;padding:16px;font:800 17px system-ui;touch-action:none;user-select:none}.btn:disabled{opacity:.45}.move{background:linear-gradient(135deg,#12a86f,#147eab);font-size:21px;padding:22px}.move:active{filter:brightness(1.2)}.row{display:flex;gap:9px}.row>*{flex:1}.notice{text-align:center;font-weight:800;font-size:18px;min-height:30px}.help{font-size:12px;text-align:center;margin:8px 0}.redtxt{color:#ff7789}.greentxt{color:#83ffbd}</style></head><body><main><div class="top"><h1>🚦 Luz Roja, Luz Verde</h1><span class="badge" id="counter">8 jugadores</span></div><p>JS FAMILY · Demo con 7 bots y vos</p><div class="top"><span class="badge" id="round">Preparados</span><span class="badge" id="clock">00:00</span></div><div class="arena" id="arena"><div class="doll" id="doll">👧</div><div class="light" id="light"></div><div class="finish"></div></div><div class="controls"><div class="notice" id="notice">Tocá iniciar para jugar</div><button class="btn move" id="move" disabled>👟 MANTENÉ PARA CORRER</button><div class="row"><button class="btn" id="start">▶ Iniciar partida</button><button class="btn" id="sound">🔊 Sonido: sí</button></div></div><p class="help">Soltá el botón apenas se ponga roja. Si seguís avanzando, quedás eliminado. La muñeca cambia de luz sin avisar.</p><p class="help"><a href="./bomba.html" style="color:#8ef7df">← Volver a Bomba Mortal</a></p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena'),notice=$('notice');let players=[],active=false,red=false,held=false,elapsed=0,deadline=0,changeAt=0,last=0,raf=0,audio=true,ctx;const colors=['#ff4c68','#2fd2c5','#f7d44e','#9b71f0','#ff9a47','#53e57a','#48bfff','#f276c3'];const shirts=['#1abf9a','#ed8537','#f05d91','#262944','#64d98a','#f2c94c','#eee','#e44578'];function beep(freq=450,dur=.1){if(!audio)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch{}}function render(p){p.el.style.bottom=(5+p.progress*.73)+'%';p.el.classList.toggle('walk',p.walk&&!p.dead&&!p.won);p.el.classList.toggle('dead',p.dead);p.el.classList.toggle('won',p.won)}function setup(){arena.querySelectorAll('.runner').forEach(x=>x.remove());players=Array.from({length:8},(_,i)=>{const p={id:i,progress:0,dead:false,won:false,walk:false,el:document.createElement('div')};p.el.className='runner';p.el.style.left=`calc(${5+i*12}% - 20px)`;p.el.style.setProperty('--skin',colors[i]);p.el.style.setProperty('--shirt',shirts[i]);p.el.innerHTML=`<b>${i===0?'⭐ VOS':'Bot '+i}</b><div class="head"><i class="eye"></i><i class="eye"></i></div><div class="torso"></div><div class="legs"><i></i><i></i></div>`;arena.append(p.el);render(p);return p});$('counter').textContent='8 jugadores'}function light(next){red=next;$('light').classList.toggle('red',red);$('doll').classList.toggle('red',red);$('round').textContent=red?'🔴 ¡QUIETOS!':'🟢 ¡CORRAN!';$('round').className='badge '+(red?'redtxt':'greentxt');beep(red?260:660,.16);changeAt=elapsed+(red?1.7+Math.random()*2:1.3+Math.random()*2.4)}function finish(){active=false;held=false;$('move').disabled=true;cancelAnimationFrame(raf);const me=players[0];const winners=players.filter(p=>p.won).length;notice.textContent=me.won?'🏆 ¡Llegaste a la meta!':me.dead?'💀 Te descubrió la muñeca':`⏰ Fin · ${winners} llegaron a la meta`;$('round').textContent='Partida terminada';$('start').textContent='↻ Volver a jugar';beep(820,.35)}function loop(now){if(!active)return;const dt=Math.min((now-last)/1000,.06);last=now;elapsed+=dt;$('clock').textContent=Math.max(0,Math.ceil(deadline-elapsed))+' s';if(elapsed>=changeAt)light(!red);players.forEach((p,i)=>{if(p.dead||p.won)return;p.walk=i===0?held:!red?Math.random()>.015:Math.random()<.004;if(p.walk){if(red){p.dead=true;p.walk=false;if(i===0){notice.textContent='💀 ¡Te moviste con luz roja!';beep(150,.35)}}else{p.progress+=dt*(i===0?17:11+Math.random()*9);if(p.progress>=100){p.progress=100;p.won=true;p.walk=false;if(i===0)notice.textContent='🏆 ¡Llegaste!'}}}render(p)});$('counter').textContent=players.filter(p=>!p.dead&&!p.won).length+' en carrera';if(players.every(p=>p.dead||p.won)||elapsed>=deadline){finish();return}raf=requestAnimationFrame(loop)}function start(){cancelAnimationFrame(raf);setup();active=true;held=false;elapsed=0;deadline=65;last=performance.now();$('move').disabled=false;$('start').textContent='↻ Reiniciar';notice.textContent='¡Corré cuando esté verde!';light(false);raf=requestAnimationFrame(loop)}$('start').addEventListener('click',start);const m=$('move');m.addEventListener('pointerdown',e=>{if(!active||players[0].dead||players[0].won)return;e.preventDefault();held=true;m.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>m.addEventListener(ev,()=>held=false));document.addEventListener('visibilitychange',()=>{held=false});$('sound').addEventListener('click',()=>{audio=!audio;$('sound').textContent=audio?'🔊 Sonido: sí':'🔇 Sonido: no'});setup()})();
</script></body></html>
