<!doctype html><html lang="es"><head><meta charset="utf-8"><title>JS Bomba Rig Test</title><style>body{background:#14202c;color:white;font-family:Arial}#world{width:640px;height:480px}</style></head><body><pre id="result">Cargando GLB...</pre><div id="world"></div><script type="module">
import * as THREE from "./vendor/three.module.js";
import {preloadOriginalModel,createOriginalRubberActor} from "./imported.js?v=20";
const el=document.getElementById('result');
try{
await preloadOriginalModel();
const a=createOriginalRubberActor({bodyColor3d:'#f83e50'}),b=createOriginalRubberActor({bodyColor3d:'#60fbb9'});
const getSkin=x=>{let skin=null; x.root.traverse(o=>{if(o.isSkinnedMesh)skin=o;});return skin;};
const skinA=getSkin(a),skinB=getSkin(b);
if(!skinA||!skinB)throw Error("No hay SkinnedMesh");
if(skinA.skeleton.bones[0]===skinB.skeleton.bones[0])throw Error("El esqueleto se comparte entre jugadores");
const map={idle:'Esperando',walk:'Caminar',hold:'Sostener_Bomba',throw:'Lanzar_Bomba',catch:'Recibir_Bomba',death:'Explotar_Caer'};
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(640,480);document.querySelector("#world").append(renderer.domElement);
scene.background=new THREE.Color('#34414d');
const camera=new THREE.PerspectiveCamera(50,640/480,.1,100);camera.position.set(0,3,9);camera.lookAt(0,1.2,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x444466,2));
scene.add(new THREE.DirectionalLight(0xffffff,2));
a.root.position.set(-1.5,0,0);b.root.position.set(1.5,0,0);scene.add(a.root,b.root);
const rotations={};
for(const action of Object.keys(map)){
for(let i=0;i<24;i++)a.update(.05,action,false);
const bone=skinA.skeleton.bones.find(b=>b.name==='Arm_L');
rotations[action]=[bone.rotation.x.toFixed(3),bone.rotation.z.toFixed(3)];
if(!Number.isFinite(bone.rotation.x))throw Error('Arm_L invalid '+action);
}
for(let i=0;i<20;i++)b.update(.05,'idle',false);
renderer.render(scene,camera);
window.__TEST_RESULT={ok:true,animations:rotations,bones:skinA.skeleton.bones.length,otherIndependent:true};
el.textContent='PASS '+JSON.stringify(window.__TEST_RESULT);
}catch(e){window.__TEST_RESULT={ok:false,error:e.stack||String(e)};el.textContent='FAIL '+window.__TEST_RESULT.error;console.error(e);}
</script></body></html>
